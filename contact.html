<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact – MERVAIQ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-nav"></div>
<header class="page-hero" data-tip="Say hi. We read every message."><div class="wrap">
<span class="eyebrow">Contact</span><h1>Let’s talk.</h1>
<p class="sub">Questions, feedback or partnership ideas? Send us a message.</p></div></header>
<section><div class="wrap"><div class="split">
<form class="card form" id="contactForm">
<label for="cn">Your name</label><input id="cn" required placeholder="Your name">
<label for="ce">Email</label><input id="ce" type="email" required placeholder="you@example.com">
<label for="ct">Topic</label><select id="ct"><option>General question</option><option>Support</option><option>Feedback</option><option>Partnership</option></select>
<label for="cm">Message</label><textarea id="cm" required placeholder="How can we help?"></textarea>
<button class="btn" type="submit">Send message</button><div id="contactMsg" role="status"></div></form>
<div class="card"><div class="ic"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></div><h3>Email us</h3><p>hello@mervaiq.com</p>
<div class="ic" style="margin-top:20px"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></div><h3>Share feedback</h3><p>Tell us what would make MERVAIQ more useful to you.</p></div>
</div></div></section>

<div id="site-foot"></div>
<script src="script.js"></script>
</body>
</html>
