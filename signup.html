<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up – MERVAIQ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="signup">
<div id="site-nav"></div>
<main class="authwrap"><div class="card authcard form"><h2>Create your account</h2><p class="sub">Start remembering and following through.</p>
<form id="signupForm"><label for="su_name">Name</label><input id="su_name" required autocomplete="name"><label for="su_email">Email</label><input id="su_email" type="email" required autocomplete="email"><label for="su_pass">Password</label><input id="su_pass" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
<label><input type="checkbox" id="su_terms"> I accept the <a href="terms.html" style="color:var(--brand);font-weight:700">Terms</a> and <a href="privacy.html" style="color:var(--brand);font-weight:700">Privacy Policy</a></label>
<div class="err" id="autherr" role="alert"></div><button class="btn" type="submit" style="width:100%">Create account</button></form>
<p class="demo">Already have an account? <a href="login.html">Sign in</a></p><p class="demo">Demo mode: accounts live in this browser only until the backend is connected.</p></div></main>
<div id="site-foot"></div>
<script src="script.js"></script>
<script src="app.js"></script>
</body>
</html>
